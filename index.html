<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Personal Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <aside class="sidebar">
      <div class="logo">Dashboard</div>
      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Analytics</a>
        <a href="#">Projects</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <div class="main-wrapper">

      <header class="header">
        <h1>Welcome Back!</h1>
        <div class="user-profile">
          <span>Profile</span>
        </div>
      </header>

      <main class="content">
 
        <section class="analytics-grid">
          <div class="card">
            <h3>Total Views</h3>
            <p class="stat">12,450</p>
          </div>
          <div class="card">
            <h3>Revenue</h3>
            <p class="stat">$3,200</p>
          </div>
          <div class="card">
            <h3>New Users</h3>
            <p class="stat">1,120</p>
          </div>
          <div class="card">
            <h3>Active Projects</h3>
            <p class="stat">8</p>
          </div>
        </section>

        <section class="activity-feed card">
          <h2>Recent Activity</h2>
          <ul>
            <li>Updated profile picture - 2 hours ago</li>
            <li>Completed task "CSS Grid Layout" - 4 hours ago</li>
            <li>Pushed new commit to GitHub - 1 day ago</li>
          </ul>
        </section>

      </main>
    </div>
  </div>
</body>
</html>
